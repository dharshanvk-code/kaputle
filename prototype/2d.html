<title>Kaputle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a single workbench column. Blueprint-grid ground, the broken object on the bench,
   parts on a pegboard, tools in a tray, and a Wordle-style row of repair attempts. */
:root {
  --bg: #e9f1fa;
  --grid: #d3e1f1;
  --card: #ffffff;
  --ink: #17324d;
  --ink-soft: #4e6a86;
  --line: #c5d5e6;
  --accent: #f26b1d;
  --accent-ink: #ffffff;
  --blue: #2f6fdb;
  --good: #2a9d4a;
  --near: #e8a900;
  --miss: #a3b2c2;
  --bubble: #fff7e8;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1c2b; --grid: #16293d; --card: #162a3f; --ink: #e5eef8; --ink-soft: #9db3ca;
    --line: #27425e; --accent: #ff8a3d; --accent-ink: #1a0e05; --blue: #6ea1ff;
    --good: #43c267; --near: #f2c230; --miss: #4d6176; --bubble: #23364b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1c2b; --grid: #16293d; --card: #162a3f; --ink: #e5eef8; --ink-soft: #9db3ca;
  --line: #27425e; --accent: #ff8a3d; --accent-ink: #1a0e05; --blue: #6ea1ff;
  --good: #43c267; --near: #f2c230; --miss: #4d6176; --bubble: #23364b; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: -0.5px; margin: 0; line-height: 1; }
.logo span { color: var(--accent); }
.meta { font-family: var(--font-display); font-weight: 500; color: var(--ink-soft); font-size: 15px; }
.head-btns { display: flex; gap: 8px; }
.icon-btn {
  font: 600 14px var(--font-display); color: var(--ink); background: var(--card);
  border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.icon-btn[aria-pressed="true"] { border-color: var(--blue); color: var(--blue); }

button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* Bench: the broken object */
.bench {
  background: var(--card); border: 2px solid var(--line); border-radius: var(--r);
  padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center;
}
.object { font-size: 84px; line-height: 1; width: 110px; height: 110px; display: grid; place-items: center;
  background: var(--bg); border-radius: 50%; border: 3px dashed var(--line); }
.object.broken { animation: wobble 2.4s ease-in-out infinite; }
.object.fixed { border: 3px solid var(--good); animation: hop .6s ease-out 2; }
@keyframes wobble { 0%,100% { transform: rotate(0); } 45% { transform: rotate(0); } 50% { transform: rotate(-6deg); } 55% { transform: rotate(5deg); } 60% { transform: rotate(0); } }
@keyframes hop { 50% { transform: translateY(-14px) scale(1.06); } }
.bench-text { min-width: 0; }
.eyebrow { font: 600 13px var(--font-display); letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 4px; }
.obj-name { font: 700 26px var(--font-display); margin: 0 0 6px; text-wrap: balance; }
.symptom { margin: 0; font-size: 18px; }
.progress { display: flex; gap: 6px; margin-top: 10px; align-items: center; font: 500 14px var(--font-display); color: var(--ink-soft); }
.pip { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); }
.pip.on { background: var(--good); border-color: var(--good); }

/* Bolt the helper */
.bolt { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.bolt-face { font-size: 40px; line-height: 1; }
.bubble {
  background: var(--bubble); border: 2px solid var(--line); border-radius: var(--r); border-top-left-radius: 4px;
  padding: 12px 14px; font-size: 18px; min-height: 52px; min-width: 0;
}
.bubble.near { border-color: var(--near); }
.bubble.good { border-color: var(--good); }
.bubble b { color: var(--accent); }

h2 { font: 600 18px var(--font-display); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 small { font: 400 14px var(--font-body); color: var(--ink-soft); }

/* Pegboard of parts, tray of tools */
.grid { display: grid; gap: 10px; }
.parts { grid-template-columns: repeat(4, 1fr); }
.tools { grid-template-columns: repeat(6, 1fr); }
@media (max-width: 560px) {
  .parts { grid-template-columns: repeat(2, 1fr); }
  .tools { grid-template-columns: repeat(3, 1fr); }
  .object { width: 88px; height: 88px; font-size: 62px; }
  .logo { font-size: 28px; }
}
.tile {
  position: relative; background: var(--card); color: var(--ink); border: 2px solid var(--line); border-radius: 14px;
  padding: 12px 6px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
  font: 600 15px var(--font-display); min-height: 88px; justify-content: center; text-align: center;
  transition: transform .12s ease, border-color .12s ease;
}
.tile .ico { font-size: 32px; line-height: 1; }
.tile:hover { transform: translateY(-2px); }
.tile:active { transform: translateY(1px); }
.tile.selected { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 25%, transparent); }
.tile .tag { position: absolute; top: 6px; right: 8px; font-size: 13px; }
.tile.is-fixed { border-color: var(--good); }
.tools .tile { min-height: 80px; font-size: 13px; }
.tools .tile .ico { font-size: 28px; }
.tools.waiting .tile { opacity: .55; }
.panel { background: color-mix(in srgb, var(--card) 70%, transparent); border-radius: var(--r); }

/* Attempt row */
.tries { display: flex; gap: 6px; flex-wrap: wrap; min-height: 34px; align-items: center; }
.sq { width: 30px; height: 30px; border-radius: 7px; }
.sq.fix { background: var(--good); }
.sq.near { background: var(--near); }
.sq.miss { background: var(--miss); }
.sq.empty { border: 2px dashed var(--line); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

/* Finish card */
.finish { background: var(--card); border: 3px solid var(--good); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.finish h3 { font: 700 28px var(--font-display); margin: 0; text-wrap: balance; }
.stars { font-size: 36px; letter-spacing: 4px; }
.learn { background: var(--bg); border-radius: 12px; padding: 12px 14px; }
.learn p { margin: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stat b { display: block; font: 700 26px var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-soft); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  font: 600 17px var(--font-display); border-radius: 999px; padding: 12px 20px; cursor: pointer;
  border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.next { font-size: 15px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.share-fallback { width: 100%; font: 14px ui-monospace, monospace; border-radius: 10px; padding: 8px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
.practice-tag { font: 600 13px var(--font-display); color: var(--blue); text-transform: uppercase; letter-spacing: 1px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 class="logo">Kaput<span>le</span></h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="head-btns">
      <button class="icon-btn" id="readBtn" aria-pressed="false" type="button">🔊 Read aloud</button>
    </div>
  </header>

  <section class="bench" aria-live="polite">
    <div class="object broken" id="object" aria-hidden="true"></div>
    <div class="bench-text">
      <p class="eyebrow">Today's broken thing</p>
      <p class="obj-name" id="objName"></p>
      <p class="symptom" id="symptom"></p>
      <div class="progress" id="progress"></div>
    </div>
  </section>

  <section class="bolt">
    <div class="bolt-face" aria-hidden="true">🤖</div>
    <div class="bubble" id="bubble" aria-live="polite"></div>
  </section>

  <div id="play">
    <section>
      <h2>1. Look at a part <small>Tap to inspect it</small></h2>
      <div class="grid parts" id="parts"></div>
    </section>
    <section style="margin-top:16px">
      <h2>2. Try a tool <small id="toolHint">Pick a part first</small></h2>
      <div class="grid tools waiting" id="tools"></div>
    </section>
  </div>

  <div id="finish" hidden></div>

  <section>
    <h2>Your tries</h2>
    <div class="tries" id="tries"></div>
    <div class="legend" style="margin-top:8px">
      <span><i style="background:var(--good)"></i>Fixed it</span>
      <span><i style="background:var(--near)"></i>Right spot, wrong tool</span>
      <span><i style="background:var(--miss)"></i>That part was fine</span>
    </div>
  </section>
</div>

<script>
const TOOLS = {
  flip:    { icon: "🔄", label: "Flip around" },
  battery: { icon: "🔋", label: "New batteries" },
  clean:   { icon: "🧽", label: "Clean" },
  tighten: { icon: "🔧", label: "Tighten" },
  oil:     { icon: "🛢️", label: "Oil" },

const PUZZLES = [

    },
    faults: [
      { part: "batt", tool: "flip",  symptom: "Click! Nothing happens. It stays totally dark.",
        clue: "Look! The batteries are in <b>backwards</b>. The bumpy + end should point toward the bulb." },

    ],
    tools: ["battery", "flip", "tighten", "clean", "tape", "oil"],

    learn: "Batteries have a + end and a – end. Electricity only flows when they point the right way and make a full loop. That loop is called a <b>circuit</b>.",

    },
    faults: [
      { part: "wheel", tool: "tighten", symptom: "Zoom... wobble wobble... it spins in a circle!",
        clue: "One wheel <b>wiggles a lot</b>. Its little nut is loose." },
      { part: "axle", tool: "oil", symptom: "It drives straight now, but it's slow and goes SQUEEEK.",
        clue: "The rod the wheels spin on is <b>dry and rusty</b>. It rubs as it turns." },
    ],
    tools: ["battery", "tighten", "tape", "oil", "clean", "pump"],
    win: "Vroom! It zooms straight and fast!",
    learn: "When dry parts rub together they make <b>friction</b>, which slows things down. Oil makes parts slippery so they slide past each other easily.",
  },
  {
    name: "Bedroom door", emoji: "🚪",
    parts: {
      hinge:  { icon: "🔩", label: "Hinges", ok: "The hinges swing quietly." },
      handle: { icon: "🖐️", label: "Handle", ok: "The handle turns smoothly." },
      latch:  { icon: "🔒", label: "Latch",  ok: "The latch pops in and out nicely." },
      bottom: { icon: "🪵", label: "Door bottom", ok: "There's a nice little gap under the door." },
    },
    faults: [
      { part: "hinge", tool: "oil", symptom: "SQUEEEEAK! The door is so loud it wakes up the cat.",
        clue: "The hinges are <b>dry and a bit rusty</b>. Metal is rubbing on metal." },

    tools: ["tighten", "oil", "tape", "trim", "clean", "flip"],

    parts: {

    faults: [

      { part: "spot", tool: "sun", symptom: "It stands up now, but the leaves are pale and stretching sideways.",

    ],
    tools: ["water", "sun", "clean", "tape", "trim", "oil"],

    learn: "Plants drink water to stay firm, and they use sunlight to make their own food. That's called <b>photosynthesis</b>.",
  },

      tail:   { icon: "🎏", label: "Tail",   ok: "The tail ribbon flutters nicely." },
      string: { icon: "🧵", label: "String", ok: "The string is long and strong, with no knots." },
      frame:  { icon: "➕", label: "Sticks", ok: "The sticks are straight and not cracked." },
    },
    faults: [
      { part: "sail", tool: "tape", symptom: "The kite goes up a little, then flops right back down.",
        clue: "There's a <b>big rip</b> in the kite! The wind whooshes straight through it." },
      { part: "tail", tool: "ribbon", symptom: "It flies now, but it spins round and round in loops!",
        clue: "The tail ribbon <b>blew away</b>. Without it, the kite can't stay pointing up." },
    ],
    tools: ["tape", "ribbon", "tighten", "putback", "pump", "trim"],

  {

      fan:  { icon: "🌀", label: "Fan", ok: "The fan spins and blows air." },

    },

      { part: "batt", tool: "battery", symptom: "Click... nothing. Not even a hum.",
        clue: "These batteries are <b>old and empty</b>, like a juice box with no juice left." },
      { part: "tank", tool: "soap", symptom: "The fan whirs, but no bubbles come out!",
        clue: "The soap tank is <b>completely dry</b>." },
    ],

    win: "Bubbles everywhere!",
    learn: "Batteries store energy and slowly run out. A bubble is a thin skin of soapy water stretched into a ball by air pushing inside it.",
  },
  {
    name: "Umbrella", emoji: "☂️",
    parts: {
      canopy: { icon: "⛱️", label: "Cloth top", ok: "The cloth is whole and waterproof." },
      ribs:   { icon: "🦴", label: "Metal arms", ok: "All the thin metal arms are straight." },
      handle: { icon: "🪝", label: "Handle", ok: "The handle is comfy and solid." },
      catch:  { icon: "🔘", label: "Open button", ok: "The button clicks and holds it open." },
    },
    faults: [
      { part: "canopy", tool: "tape", symptom: "Drip, drip! Raindrops land right on your head.",
        clue: "There's a <b>small hole</b> in the cloth on top." },
      { part: "catch", tool: "tighten", symptom: "You stay dry now, but the umbrella keeps snapping shut!",
        clue: "The little catch that holds it open is <b>loose and wobbly</b>." },
    ],
    tools: ["tape", "tighten", "oil", "putback", "clean", "trim"],

    learn: "Waterproof cloth keeps rain out because water can't soak through it. Even a tiny hole is enough for drops to sneak in!",
  },
];

// ---------- storage (optional) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---------- daily puzzle ----------
function todayNumber() {
  const now = new Date();
  const t = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((t - Date.UTC(2026, 9, 25)) / 864e5) + 1;
}
const mod = (n, m) => ((n % m) + m) % m;
const DAY = todayNumber();

let S; // game state
const $ = id => document.getElementById(id);

function newState(mode, idx) {
  return { mode, idx, fixed: [], attempts: [], selected: null, msg: null, msgKind: "", done: false };
}

function startDaily() {
  const saved = store.get("kaputle:day:" + DAY, null);
  S = newState("daily", mod(DAY - 1, PUZZLES.length));
  if (saved) Object.assign(S, { fixed: saved.fixed, attempts: saved.attempts, done: saved.done });
  render();
  if (!S.done) say(`Hi, I'm Bolt! Our ${P().name.toLowerCase()} is broken. Tap a part to look for clues.`);
}

function startPractice() {
  let idx;
  do { idx = Math.floor(Math.random() * PUZZLES.length); } while (PUZZLES.length > 1 && idx === mod(DAY - 1, PUZZLES.length));
  S = newState("practice", idx);
  render();
  say(`Practice time! This ${P().name.toLowerCase()} needs fixing. It won't change your streak.`);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

const P = () => PUZZLES[S.idx];
const openFaults = () => P().faults.map((f, i) => i).filter(i => !S.fixed.includes(i));

function save() {
  if (S.mode !== "daily") return;
  store.set("kaputle:day:" + DAY, { fixed: S.fixed, attempts: S.attempts, done: S.done });
}

// ---------- speech ----------
let readAloud = store.get("kaputle:read", false);
function say(html, kind = "") {
  S.msg = html; S.msgKind = kind;
  const b = $("bubble");
  b.innerHTML = html;
  b.className = "bubble " + kind;
  if (readAloud) speak(b.textContent);
}
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\p{Extended_Pictographic}/gu, ""));
    u.rate = 0.95; u.pitch = 1.15;
    speechSynthesis.speak(u);
  } catch {}
}

// ---------- actions ----------
function pickPart(key) {
  if (S.done) return;
  S.selected = key;
  const part = P().parts[key];
  const fi = P().faults.findIndex(f => f.part === key);
  let text;
  if (fi >= 0 && S.fixed.includes(fi)) text = `The ${part.label.toLowerCase()} is all fixed now. ✓`;
  else if (fi >= 0) text = `🔍 ${P().faults[fi].clue}`;
  else text = `🔍 ${part.ok}`;
  render();
  say(text);
}

function useTool(toolKey) {
  if (S.done) return;
  if (!S.selected) { say("First tap a part to look at it. Then pick a tool!"); return; }
  const part = P().parts[S.selected];
  const tool = TOOLS[toolKey];
  const fi = P().faults.findIndex(f => f.part === S.selected);

  if (fi >= 0 && S.fixed.includes(fi)) { say(`The ${part.label.toLowerCase()} is already fixed. Look at the other parts!`); return; }

  if (fi >= 0 && P().faults[fi].tool === toolKey) {
    S.attempts.push("fix");
    S.fixed.push(fi);
    S.selected = null;
    if (openFaults().length === 0) {
      S.done = true;
      finishGame();
    } else {
      const next = P().faults[openFaults()[0]];
      say(`🎉 <b>${tool.label}</b> worked! But wait... ${next.symptom} There's another problem to find.`, "good");
    }
  } else if (fi >= 0) {
    S.attempts.push("near");
    say(`You found a problem spot! But <b>${tool.label.toLowerCase()}</b> didn't fix it. That's okay. What else could help?`, "near");
  } else {
    S.attempts.push("miss");
    say(`Hmm, nothing changed. The ${part.label.toLowerCase()} was working fine. Now we know the problem is somewhere else!`);
  }
  save();
  render();
}

function finishGame() {
  if (S.mode === "daily") {
    const st = store.get("kaputle:stats", { played: 0, streak: 0, best: 0, lastDay: null });
    if (st.lastDay !== DAY) {
      st.streak = st.lastDay === DAY - 1 ? st.streak + 1 : 1;
      st.played += 1;
      st.best = Math.max(st.best, st.streak);
      st.lastDay = DAY;
      store.set("kaputle:stats", st);
    }
  }
  say(`🎉 You fixed it! ${P().win}`, "good");
}

function stars() {
  const extra = S.attempts.length - P().faults.length;
  return extra <= 0 ? 3 : extra <= 2 ? 2 : 1;
}

function shareText() {
  const map = { fix: "🟩", near: "🟨", miss: "⬜" };
  const label = S.mode === "daily" ? `Kaputle #${DAY}` : "Kaputle practice";
  return `${label} ${P().emoji}\n${S.attempts.map(a => map[a]).join("")}\nFixed in ${S.attempts.length} ${S.attempts.length === 1 ? "try" : "tries"} ${"⭐".repeat(stars())}`;
}

async function share(btn) {
  const text = shareText();
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = "Copied!";
    setTimeout(() => (btn.textContent = "Share result"), 1800);
  } catch {
    const ta = $("shareFallback");
    ta.hidden = false; ta.value = text; ta.focus(); ta.select();
  }
}

// ---------- render ----------
function render() {
  const p = P();
  $("meta").innerHTML = S.mode === "daily"
    ? `Puzzle #${DAY} · a new fix every day`
    : `<span class="practice-tag">Practice round</span>`;
  const obj = $("object");
  obj.textContent = p.emoji;
  obj.className = "object " + (S.done ? "fixed" : "broken");
  $("objName").textContent = p.name;
  $("symptom").textContent = S.done ? p.win : p.faults[openFaults()[0]].symptom;
  $("progress").innerHTML = `<span>Problems fixed</span>` +
    p.faults.map((f, i) => `<span class="pip ${S.fixed.includes(i) ? "on" : ""}"></span>`).join("");

  $("play").hidden = S.done;
  $("finish").hidden = !S.done;

  if (!S.done) {
    $("parts").innerHTML = Object.entries(p.parts).map(([k, part]) => {
      const fi = p.faults.findIndex(f => f.part === k);
      const isFixed = fi >= 0 && S.fixed.includes(fi);
      return `<button type="button" class="tile ${S.selected === k ? "selected" : ""} ${isFixed ? "is-fixed" : ""}" data-part="${k}" aria-pressed="${S.selected === k}">
        ${isFixed ? '<span class="tag" aria-label="fixed">✅</span>' : ""}
        <span class="ico" aria-hidden="true">${part.icon}</span>${part.label}</button>`;
    }).join("");
    $("tools").innerHTML = p.tools.map(k =>
      `<button type="button" class="tile" data-tool="${k}"><span class="ico" aria-hidden="true">${TOOLS[k].icon}</span>${TOOLS[k].label}</button>`
    ).join("");
    $("tools").classList.toggle("waiting", !S.selected);
    $("toolHint").textContent = S.selected ? `Use it on the ${p.parts[S.selected].label.toLowerCase()}` : "Pick a part first";
  } else {
    renderFinish();
  }

  const n = S.attempts.length;
  $("tries").innerHTML = S.attempts.map(a => `<span class="sq ${a}" title="${a}"></span>`).join("") +
    (S.done ? "" : `<span class="sq empty"></span>`) +
    (n ? "" : `<span class="legend">No tries yet. Investigate first!</span>`);
}

function renderFinish() {
  const p = P();
  const st = store.get("kaputle:stats", { played: 0, streak: 0, best: 0 });
  const s = stars();
  const cheer = s === 3 ? "Perfect fix!" : s === 2 ? "Great detective work!" : "You never gave up!";
  $("finish").innerHTML = `
    <div class="finish">
      <div class="stars" aria-label="${s} stars">${"⭐".repeat(s)}${"☆".repeat(3 - s)}</div>
      <h3>${cheer} Fixed in ${S.attempts.length} ${S.attempts.length === 1 ? "try" : "tries"}.</h3>
      <div class="learn"><p class="eyebrow">How it works</p><p>${p.learn}</p></div>
      ${S.mode === "daily" ? `
      <div class="stats">
        <div class="stat"><b>${st.played}</b><span>Fixed</span></div>
        <div class="stat"><b>${st.streak}</b><span>Day streak</span></div>
        <div class="stat"><b>${st.best}</b><span>Best streak</span></div>
      </div>
      <div class="next" id="countdown"></div>` : ""}
      <div class="actions">
        <button type="button" class="btn" id="shareBtn">Share result</button>
        <button type="button" class="btn ghost" id="practiceBtn">Practice another</button>
        ${S.mode === "practice" ? `<button type="button" class="btn ghost" id="dailyBtn">Back to today's puzzle</button>` : ""}
      </div>
      <textarea class="share-fallback" id="shareFallback" rows="3" hidden aria-label="Copy your result"></textarea>
    </div>`;
  $("shareBtn").onclick = e => share(e.currentTarget);
  $("practiceBtn").onclick = startPractice;
  if ($("dailyBtn")) $("dailyBtn").onclick = startDaily;
  tick();
}

function tick() {
  const el = $("countdown");
  if (!el) return;
  const now = new Date();
  const mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const ms = mid - now;
  const h = Math.floor(ms / 36e5), m = Math.floor(ms / 6e4) % 60, sec = Math.floor(ms / 1e3) % 60;
  el.textContent = `Next broken thing arrives in ${h}h ${String(m).padStart(2, "0")}m ${String(sec).padStart(2, "0")}s`;
}
setInterval(tick, 1000);

// ---------- events ----------
$("parts").addEventListener("click", e => { const t = e.target.closest("[data-part]"); if (t) pickPart(t.dataset.part); });
$("tools").addEventListener("click", e => { const t = e.target.closest("[data-tool]"); if (t) useTool(t.dataset.tool); });
const readBtn = $("readBtn");
readBtn.setAttribute("aria-pressed", String(readAloud));
readBtn.onclick = () => {
  readAloud = !readAloud;
  store.set("kaputle:read", readAloud);
  readBtn.setAttribute("aria-pressed", String(readAloud));
  if (readAloud) speak($("bubble").textContent); else try { speechSynthesis.cancel(); } catch {}
};

startDaily();
</script>
